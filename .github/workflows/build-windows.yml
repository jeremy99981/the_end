name: Build The End for Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore TheEnd.sln
      - name: Test
        run: dotnet test TheEnd.sln --configuration Release --no-restore
      - name: Publish portable executable
        run: dotnet publish src/TheEnd.App/TheEnd.App.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/TheEnd-Windows-x64
      - name: Rename executable
        shell: pwsh
        run: Rename-Item artifacts/TheEnd-Windows-x64/TheEnd.App.exe TheEnd.exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheEnd-Windows-x64
          path: artifacts/TheEnd-Windows-x64/TheEnd.exe
          if-no-files-found: error
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/TheEnd-Windows-x64/TheEnd.exe
          generate_release_notes: true
